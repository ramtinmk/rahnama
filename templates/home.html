<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>راهنما</title>
    <link href="../../static/css/persian/main.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&display=swap');
    </style>
</head>
<body>
    {% include 'container.html' with context %}

    <div class="main">
        <div class="topbar">
            <div class="toggle">
                <ion-icon name="menu-outline"></ion-icon>
            </div>

            <form class="search" action="/search">
                <label>
                    <input type="text" placeholder="Search here", name="search_word">
                    <ion-icon name="search-outline"></ion-icon>
                </label>
            </form>

            <div class="logo">
              <a href="/home">  <img src="../../static/images/logo.png.png" alt=""></a>
            </div>
    </div>
    <div class="main-content">
        <div class="text-container">
            {% if is_logged %}
            <h1 class="welcome-message">خوش آمدید {{username}}</h1>
            {% endif %}
            <h1 class="titr">راهنما</h1>
            <p class="lead">  راهنما،امکان دسترسی به دانش و اطلاعات در زمینه‌های مختلف  را بوجود آورده است. به جمع ما بپیوندید و با یک کلیک به پاسخ‌های خود برسید!

            </p>
            <div class="button-group">
                {% if is_logged %}
                <a class="btn btn-start" href="/questions/ask">بزن بریم</a>
                {% else %}
                <a class="btn btn-about" href="/login">ورود</a>
                {% endif %}
            </div>
        </div>
        <div class="image-container">
            <img class="logo-image" src="../../static/images/logo.png.png" alt="Solve It Place Logo" />
        </div>
    </div>
    
    
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    <script src="../../static/js/main.js"></script>
</body>
</html>
